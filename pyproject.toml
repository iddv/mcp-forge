[project]
name = "mcp-forge"
version = "3.0.0"
description = "Scaffold, extend, and distribute MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer>=0.16.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "anyio>=4.0.0",
    # Integration tests run generated servers against the real SDK
    "mcp[cli]>=2.3,<3",
]

[project.scripts]
mcp-forge = "mcp_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_forge"]
